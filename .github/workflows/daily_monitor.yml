name: Monitoramento Diário de Fluxos Viários

on:
  # Agendamento automático (Horário UTC):
  # 10:50 UTC = 07:50 Horário de Brasília
  # 16:30 UTC = 13:30 Horário de Brasília
  schedule:
    - cron: '50 10 * * *'
    - cron: '30 16 * * *'
  
  # Permite disparar manualmente pela aba 'Actions' no GitHub
  workflow_dispatch:

jobs:
  monitor-flows:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 Instalar Navegadores Playwright
        run: |
          playwright install --with-deps chromium

      - name: 🔑 Restaurar Sessão Autenticada (se configurada)
        env:
          SESSION_STATE_JSON: ${{ secrets.SESSION_STATE_JSON }}
        run: |
          if [ -n "$SESSION_STATE_JSON" ]; then
            echo "$SESSION_STATE_JSON" > session_state.json
            echo "✅ Sessão autenticada 'session_state.json' restaurada com sucesso."
          else
            echo "ℹ️ Secret SESSION_STATE_JSON não configurada. Prosseguindo com autenticação via credenciais."
          fi

      - name: 🚗 Executar Monitoramento de Fluxos
        env:
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          SITE_LOGIN_URL: ${{ secrets.SITE_LOGIN_URL }}
          SITE_FLOWS_URL: ${{ secrets.SITE_FLOWS_URL }}
          SITE_USERNAME: ${{ secrets.SITE_USERNAME }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_EMAILS_TO: ${{ secrets.ALERT_EMAILS_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EQUIPMENT_LIST: ${{ secrets.EQUIPMENT_LIST || 'SPK347,SPK348,SPK351,SPK352,SBR034,SBR136,SBR185,SBR244,SBR286,SBR292,SBR298,SBR391,SBR392,SBR397,SBR399,SBR402,SBR403,SBR427,SBR506,SBR507,SBR631,SBR745,SBR816' }}
          INITIAL_PAGE_WAIT_SECONDS: "10"
          HEADLESS: "True"
          BROWSER_TIMEOUT_MS: "45000"
          MOCK_MODE: "False"
        run: |
          python main.py

